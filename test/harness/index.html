<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>pdf-annotator harness</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      :root {
        --background-primary: #ffffff;
        --background-secondary: #f4f4f4;
        --background-secondary-alt: #ececec;
        --text-normal: #222222;
        --text-muted: #666666;
        --text-faint: #999999;
        --text-on-accent: #ffffff;
        --interactive-accent: #4a7bd0;
        --background-modifier-border: #dddddd;
        --background-modifier-hover: #eeeeee;
        --font-interface: -apple-system, sans-serif;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: var(--font-interface);
      }
      #mount {
        height: 100%;
      }
      .workspace-leaf-content {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .view-content {
        height: 100%;
        overflow: hidden;
        position: relative;
      }
      .pdfann-tool {
        min-width: 30px;
        min-height: 30px;
      }
    </style>
  </head>
  <body>
    <div id="mount"></div>
    <script src="bundle.js"></script>
  </body>
</html>
